[package]
name = "memo-app"
version = "0.1.1"
description = "간단한 txt 메모장"
authors = ["GEOINNOVATION"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
